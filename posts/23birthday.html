<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生日快乐 🎂 星空之书</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== 基础设置 ===== */
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #0d0514 80%);
      font-family: 'Microsoft YaHei', sans-serif; color: #fff;
      display: flex; justify-content: center; align-items: center;
    }
    /* ===== 星空背景 ===== */
    .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.1; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #c4b5fd; } }

    /* ===== 开场遮罩 ===== */
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 5, 20, 0.95); z-index: 50;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 1s ease;
    }
    .overlay h1 { font-size: 2.5em; color: #c4b5fd; letter-spacing: 3px; margin-bottom: 15px; text-shadow: 0 0 20px rgba(196, 181, 253, 0.6); }
    .overlay p { color: #a78bfa; margin-bottom: 30px; letter-spacing: 1px; }
    .overlay button {
      padding: 14px 40px; font-size: 1.1em; border: 1px solid #c4b5fd;
      background: transparent; color: #c4b5fd; border-radius: 30px; cursor: pointer;
      transition: all 0.4s; letter-spacing: 2px;
    }
    .overlay button:hover { background: #c4b5fd; color: #0d0514; box-shadow: 0 0 30px #c4b5fd; transform: scale(1.05); }

    /* ===== 书本主容器 ===== */
    .book-wrapper {
      position: relative; z-index: 10;
      width: 90vw; max-width: 900px; height: 65vh; max-height: 600px;
      perspective: 2500px; /* 3D景深，让翻页有立体感 */
      opacity: 0; transition: opacity 1.5s ease;
      display: flex; justify-content: center; align-items: center;
    }
    
    /* 书脊阴影 */
    .book-wrapper::after {
      content: ''; position: absolute; top: 0; left: 50%; width: 40px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,0.15), transparent);
      transform: translateX(-50%); z-index: 20; pointer-events: none;
    }

    .book {
      position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    }

    /* ===== 每一页 ===== */
    .page {
      position: absolute; top: 0; width: 50%; height: 100%;
      background: #fdfdfd; color: #2c2c2c; box-sizing: border-box;
      padding: 40px 35px; display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-radius: 5px 12px 12px 5px; /* 纸张边缘 */
      box-shadow: 
        inset 5px 0 15px rgba(0,0,0,0.03), /* 书脊处阴影 */
        5px 5px 25px rgba(0,0,0,0.2); /* 整体阴影 */
      transform-origin: left center; /* 翻页时以左侧为轴 */
      transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), z-index 0s; /* 柔软的缓动曲线 */
      backface-visibility: hidden; /* 隐藏背面 */
      overflow: hidden;
    }
    
    /* 右页（偶数页）从右侧开始 */
    .page.right-page {
      right: 0; transform-origin: left center;
    }
    /* 左页（奇数页）在左侧 */
    .page.left-page {
      left: 0; transform-origin: right center;
      border-radius: 12px 5px 5px 12px;
      box-shadow: inset -5px 0 15px rgba(0,0,0,0.03), -5px 5px 25px rgba(0,0,0,0.2);
    }

    /* 翻页状态 */
    .page.flipped-right { transform: rotateY(-180deg); }
    .page.flipped-left { transform: rotateY(180deg); }

    /* ===== 页面内容样式 ===== */
    .page h2 { color: #5b21b6; font-size: 1.8em; font-weight: 500; margin-bottom: 15px; letter-spacing: 1px; }
    .page p { line-height: 2; color: #555; font-size: 1em; text-align: center; margin-top: 10px; }
    
    /* 照片展示区 */
    .photo-frame {
      width: 85%; height: 45%; border-radius: 8px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      display: flex; justify-content: center; align-items: center;
      color: white; font-size: 0.9em; letter-spacing: 1px;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
      border: 2px solid rgba(255,255,255,0.8);
    }

    /* ===== 翻页按钮 ===== */
    .controls {
      position: absolute; bottom: -60px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 20px; z-index: 30;
    }
    .controls button {
      padding: 10px 25px; border-radius: 25px; border: 1px solid #c4b5fd;
      background: rgba(196, 181, 253, 0.15); color: #c4b5fd; cursor: pointer;
      transition: all 0.3s; font-size: 0.95em; letter-spacing: 1px;
      display: flex; align-items: center; gap: 8px;
    }
    .controls button:hover { background: #c4b5fd; color: #0d0514; box-shadow: 0 0 20px rgba(196, 181, 253, 0.4); }
    .controls button:disabled { opacity: 0.3; cursor: not-allowed; border-color: #666; color: #666; background: transparent; }

    /* ===== 结局/惊喜动画 ===== */
    .finale {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 40; opacity: 0; pointer-events: none; transition: opacity 1s ease;
      background: rgba(13, 5, 20, 0.8);
    }
    .finale.show { opacity: 1; pointer-events: auto; }
    .finale h2 { font-size: 2.5em; color: #fff; text-shadow: 0 0 30px #c4b5fd; margin-bottom: 20px; }
    .finale p { color: #c4b5fd; font-size: 1.2em; margin-bottom: 30px; }
    .finale button {
      padding: 12px 30px; border-radius: 25px; border: 1px solid #c4b5fd;
      background: transparent; color: #c4b5fd; cursor: pointer; transition: all 0.3s;
    }
    .finale button:hover { background: #c4b5fd; color: #0d0514; }

    /* ===== 音乐盒 ===== */
    .music-box {
      position: fixed; bottom: 30px; right: 30px; z-index: 60;
      width: 55px; height: 55px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); transition: all 0.3s;
    }
    .music-box:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(139, 92, 246, 0.6); }
    .music-box i { font-size: 24px; color: #c4b5fd; animation: rotate 4s linear infinite; animation-play-state: paused; }
    .music-box.playing i { animation-play-state: running; }
    @keyframes rotate { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="stars" id="starfield"></div>

  <!-- 开场遮罩 -->
  <div class="overlay" id="overlay">
    <h1>🎂 生日快乐</h1>
    <p>有份惊喜，等你开启</p>
    <button id="startBtn">点击开启祝福 ✨</button>
  </div>

  <!-- 书本区域 -->
  <div class="book-wrapper" id="bookWrapper">
    <div class="book" id="book">
      <!-- 第 1 页：封面（左） -->
      <div class="page left-page" style="z-index: 5;">
        <h2>封面</h2>
        <p>这是属于你的星空。</p>
        <p style="color: #888; font-size: 0.8em; margin-top: 20px;">—— 点击下方按钮开启 ——</p>
      </div>
      <!-- 第 2 页：内页1（右） -->
      <div class="page right-page" style="z-index: 4;">
        <div class="photo-frame">照片展示区 1</div>
        <h2>初识</h2>
        <p>还记得我们第一次见面吗？</p>
      </div>
      <!-- 第 3 页：内页2（左） -->
      <div class="page left-page" style="z-index: 3;">
        <div class="photo-frame">照片展示区 2</div>
        <h2>陪伴</h2>
        <p>感谢那些一起走过的日子。</p>
      </div>
      <!-- 第 4 页：内页3（右） -->
      <div class="page right-page" style="z-index: 2;">
        <div class="photo-frame">照片展示区 3</div>
        <h2>祝福</h2>
        <p>愿你岁岁平安，万事胜意。</p>
      </div>
      <!-- 第 5 页：封底（左） -->
      <div class="page left-page" style="z-index: 1;">
        <h2>致亲爱的你</h2>
        <p>愿星空照耀你前行的路。</p>
        <p style="color: #d65c43; font-weight: bold; margin-top: 20px;">生日快乐！</p>
      </div>
    </div>

    <!-- 翻页按钮 -->
    <div class="controls" id="controls">
      <button id="prevBtn" disabled><i class="fas fa-chevron-left"></i> 上一页</button>
      <button id="nextBtn">下一页 <i class="fas fa-chevron-right"></i></button>
    </div>
  </div>

  <!-- 结局惊喜（默认隐藏） -->
  <div class="finale" id="finale">
    <h2>🎉 生日快乐！</h2>
    <p>愿这份星空之书，能带给你一整年的好运。</p>
    <button onclick="location.reload()">🔄 重温一遍</button>
  </div>

  <!-- 音乐盒 -->
  <div class="music-box" id="musicBox">
    <i class="fas fa-compact-disc"></i>
    <audio id="bgm" src="../music/song.mp3" loop></audio>
  </div>

  <script>
    /* ===== 1. 生成星空 ===== */
    const starfield = document.getElementById('starfield');
    for (let i = 0; i < 180; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      let size = Math.random() * 2.5 + 0.5;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      star.style.animationDelay = Math.random() * 5 + 's';
      starfield.appendChild(star);
    }

    /* ===== 2. 书本翻页逻辑 ===== */
    const leftPages = document.querySelectorAll('.left-page');
    const rightPages = document.querySelectorAll('.right-page');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const finale = document.getElementById('finale');
    
    let currentStep = 0; // 0: 封面, 1: 第1次翻页, 2: 第2次翻页, 3: 第3次翻页, 4: 结局
    const maxStep = 4; // 总共4次翻页动作

    function updateBook() {
      // 重置所有页面的翻转状态
      leftPages.forEach(p => p.classList.remove('flipped-left'));
      rightPages.forEach(p => p.classList.remove('flipped-right'));

      // 根据当前步骤处理翻页
      // 第1步：右页1翻过去，变成左页，露出右页2
      if (currentStep >= 1) {
        rightPages[0].classList.add('flipped-right'); // 第1页（封面）翻过去
      }
      // 第2步：右页2翻过去，露出左页2
      if (currentStep >= 2) {
        rightPages[1].classList.add('flipped-right'); // 第2页翻过去
        leftPages[1].classList.add('flipped-left');  // 第3页（左）出现
      }
      // 第3步：右页3翻过去，露出左页3
      if (currentStep >= 3) {
        rightPages[2].classList.add('flipped-right'); // 第4页翻过去
        leftPages[2].classList.add('flipped-left');  // 第5页（左）出现
      }

      // 按钮状态
      prevBtn.disabled = (currentStep === 0);
      
      if (currentStep === maxStep) {
        nextBtn.disabled = true;
        // 延迟一秒，展示结局动画
        setTimeout(() => {
          finale.classList.add('show');
        }, 1000);
      } else {
        nextBtn.disabled = false;
      }
    }

    nextBtn.addEventListener('click', () => {
      if (currentStep < maxStep) {
        currentStep++;
        updateBook();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentStep > 0) {
        currentStep--;
        updateBook();
        finale.classList.remove('show'); // 如果退回，隐藏结局
      }
    });

    /* ===== 3. 启动与音乐 ===== */
    const overlay = document.getElementById('overlay');
    const bookWrapper = document.getElementById('bookWrapper');
    const startBtn = document.getElementById('startBtn');
    const musicBox = document.getElementById('musicBox');
    const bgm = document.getElementById('bgm');

    startBtn.addEventListener('click', () => {
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
        bookWrapper.style.opacity = '1';
        
        // 尝试播放音乐
        bgm.play().catch(e => console.log('等待上传音乐文件后才能播放哦'));
        musicBox.classList.add('playing');
      }, 800);
    });

    /* ===== 4. 音乐盒控制 ===== */
    musicBox.addEventListener('click', () => {
      if (bgm.paused) {
        bgm.play().catch(e => console.log('音乐还没上传呢！'));
        musicBox.classList.add('playing');
      } else {
        bgm.pause();
        musicBox.classList.remove('playing');
      }
    });
  </script>
</body>
</html>
